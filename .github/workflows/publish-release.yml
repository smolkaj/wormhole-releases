name: Publish Latest Release

on:
  push:
    branches:
      - release-staging

permissions:
  contents: write

concurrency:
  group: publish-latest-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate staged APK and update metadata
        id: meta
        run: |
          set -euo pipefail
          [[ -f wormhole-release.apk && -f update-metadata.json ]] || {
            echo "::error::Missing wormhole-release.apk or update-metadata.json in release-staging branch."
            exit 1
          }
          ACTUAL_SHA="$(sha256sum wormhole-release.apk | awk '{print $1}')"
          MAGIC_HEX="$(od -An -tx1 -N4 wormhole-release.apk | tr -d '[:space:]')"
          if [[ "$MAGIC_HEX" != "504b0304" ]]; then
            echo "::error::wormhole-release.apk does not start with ZIP magic header (got ${MAGIC_HEX})."
            exit 1
          fi
          python3 - "$ACTUAL_SHA" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          actual_sha = sys.argv[1]
          with open("update-metadata.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          version_code = data["versionCode"]
          version_name = data["versionName"]
          apk_sha = data["apkSha256"]
          assert isinstance(version_code, int) and version_code > 0, f"Invalid versionCode: {version_code}"
          assert isinstance(version_name, str) and version_name.strip(), f"Invalid versionName: {version_name}"
          assert apk_sha == actual_sha, f"SHA-256 mismatch: metadata={apk_sha}, apk={actual_sha}"
          print(f"version_code={version_code}")
          print(f"version_name={version_name}")
          print(f"apk_sha256={apk_sha}")
          PY

      - name: Publish rolling 'latest' GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          APK_SHA256: ${{ steps.meta.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          NOTES=$(printf '%s\n\n%s\n%s\n' \
            "Rolling latest build \`${VERSION_NAME}\` (versionCode ${VERSION_CODE})." \
            "- Tap \`wormhole-release.apk\` directly on your Android device for the R8-optimized install (no unzipping required)." \
            "- Release APK SHA-256: \`${APK_SHA256}\`")

          # Delete any existing rolling 'latest' releases (including stray untagged drafts) by ID
          # without deleting refs/tags/latest. Deleting the tag triggers GitHub's async tag-delete
          # cleanup hook, which races with immediate `gh release create latest` and can demote the
          # newly published release back into an untagged Draft.
          EXISTING_IDS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == "latest" or (.draft == true and (((.tag_name // "") | startswith("untagged-")) or ((.name // "") | startswith("Wormhole Latest ("))))) | .id')"
          while IFS= read -r rel_id; do
            [[ -z "$rel_id" ]] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${rel_id}" >/dev/null
          done <<< "$EXISTING_IDS"

          # Resolve main HEAD SHA and update refs/tags/latest in-place (creating it only if absent).
          TARGET_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if TAG_REF_INFO="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" \
            --jq '[.object.type, .object.sha] | @tsv' 2>/dev/null)"; then
            CURRENT_TAG_TYPE="${TAG_REF_INFO%%$'\t'*}"
            CURRENT_TAG_SHA="${TAG_REF_INFO#*$'\t'}"
            if [[ "$CURRENT_TAG_TYPE" != "commit" || "$CURRENT_TAG_SHA" != "$TARGET_SHA" ]]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
                -f sha="$TARGET_SHA" \
                -F force=true >/dev/null
            fi
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/latest" \
              -f sha="$TARGET_SHA" >/dev/null
          fi

          gh release create latest wormhole-release.apk update-metadata.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "Wormhole Latest (${VERSION_NAME})" \
            --notes "$NOTES"

          CREATED_RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest")"
          python3 - "$CREATED_RELEASE_JSON" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get("draft") is False, f"Expected draft=false, got {data.get('draft')!r}"
          assert data.get("tag_name") == "latest", f"Expected tag_name='latest', got {data.get('tag_name')!r}"
          assets = {a.get("name") for a in data.get("assets", [])}
          assert "wormhole-release.apk" in assets, f"Missing wormhole-release.apk in release assets: {assets}"
          assert "update-metadata.json" in assets, f"Missing update-metadata.json in release assets: {assets}"
          print(f"Verified public release id={data.get('id')} tag={data.get('tag_name')} draft={data.get('draft')} published_at={data.get('published_at')}")
          PY

      - name: Clean up temporary release-staging branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/release-staging" >/dev/null 2>&1 || true
